<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000">
<title>🌹</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080808'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44'%3E%F0%9F%92%90%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html{background:#000000}html,body{margin:0;width:100%;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;background:#000000;color:#fafafa}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}body::before{content:'';position:fixed;inset:0;background:#000000;z-index:-1}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #fff;outline-offset:8px}main{min-height:100svh;display:grid;place-items:center;padding:24px}#question{width:100%;text-align:center;position:relative;top:-2vh}h1{font-size:clamp(26px,5.9vw,48px);font-weight:400;line-height:1.5;letter-spacing:-.035em;margin:0 0 58px;word-break:keep-all}.buttons{display:flex;align-items:center;justify-content:center;gap:clamp(22px,7vw,46px);min-height:68px}.choice{width:clamp(120px,33vw,180px);height:68px;border-radius:100px;font-size:25px;font-weight:600}#yes{background:linear-gradient(115deg,#ed3049,#ff1149);color:#fff;box-shadow:0 9px 45px #fa25452b;position:relative;z-index:2;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}#yes:hover{box-shadow:0 9px 55px #fa25455c}#no{background:#232323;color:#929292;z-index:4}#no.roaming{position:fixed;left:var(--x);top:var(--y);width:120px;height:60px;margin:0}#gift{display:none;text-align:center;width:min(600px,100%)}body.accepted #question{display:none}body.accepted #gift{display:block;animation:arrive .8s both}#gift h1{font-size:clamp(28px,6vw,42px);margin:14px 0 8px}#gift p{color:#c2aab0;font-size:17px;margin:0}.bouquet{display:block;width:min(82vw,440px);height:min(82vw,440px);object-fit:contain;margin:0 auto;filter:drop-shadow(0 0 45px #e7346215);animation:bloom 1.1s cubic-bezier(.2,.8,.2,1) both}.again{background:transparent;color:#99888d;border-bottom:1px solid #55434a;border-radius:0;padding:10px 2px;margin-top:32px;font-size:14px}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes bloom{from{opacity:0;transform:scale(.45) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}@media(max-height:600px){h1{margin-bottom:28px}.bouquet{width:45svh;height:45svh}#question{top:0}.again{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

body.accepted main{padding:0}#gift{position:relative;width:100%;height:100svh;overflow:hidden}#bouquet{position:absolute;bottom:5svh;left:50%;transform:translateX(-50%);width:min(100vw,560px,76svh);height:min(140vw,784px,90svh);padding:0;background:transparent;color:inherit}#flower-art{display:block;width:100%;height:100%;overflow:visible}#gift-title{position:absolute;bottom:10svh;left:0;right:0;color:#777;font-size:14px;margin:0;pointer-events:none}#gift .again{position:absolute;bottom:2svh;left:50%;transform:translateX(-50%);margin:0;color:#8c7a7e}.flower-bloom{transform-box:fill-box;transform-origin:center;animation:petal-open 2.6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}.flower-sway{transform-box:fill-box;transform-origin:50% 90%;animation:sway 4s ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes petal-open{from{transform:scale(.02) rotate(-45deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

#hearts{z-index:0}main{position:relative;z-index:1}

[hidden]{display:none!important}#name-screen{width:min(100%,430px);text-align:center;transform:translateY(-2vh)}#name-title{font-size:clamp(26px,6vw,38px);margin-bottom:36px}#name-form{display:flex;flex-direction:column;align-items:center;gap:16px}#recipient-name{width:100%;min-height:60px;border:1px solid #444;border-radius:16px;padding:16px 20px;font:inherit;font-size:20px;color:#fff;background:#202020;text-align:center;outline:none}#recipient-name:focus{border-color:#ff3153;box-shadow:0 0 0 3px #ff315322}#name-submit{margin-top:8px;padding:16px 48px;border-radius:40px;background:#fa2447;color:white;font-size:20px}#question-title{font-size:clamp(23px,5.7vw,40px);overflow-wrap:anywhere;line-height:1.65}#question-title:focus{outline:none}
</style>
</head>
<body>
<main>
<section id="name-screen" aria-labelledby="name-title"><form id="name-form"><h1 id="name-title"><label for="recipient-name">이름을 입력해주세요.</label></h1><input id="recipient-name" name="recipient" type="text" maxlength="30" autocomplete="given-name" required aria-label="이름" placeholder="이름"><button id="name-submit" type="submit">확인</button></form></section>
<section id="question" hidden aria-labelledby="question-title"><h1 id="question-title" tabindex="-1"><span id="recipient-greeting"></span><br>열어보시겠습니까?</h1><div class="buttons"><button id="yes" class="choice" type="button">Yes</button><button id="no" class="choice" type="button">No</button></div></section>
<section id="gift" aria-label="당신을 위한 꽃다발"><button id="bouquet" type="button" aria-label="꽃다발을 눌러 하트 폭죽 터뜨리기"><svg id="flower-art" viewBox="0 0 500 700" role="img" aria-labelledby="flower-title"><title id="flower-title">빨간 꽃들과 노란 꽃 한 송이가 피어나는 꽃다발</title><defs><linearGradient id="wrap"><stop stop-color="#191919"/><stop offset=".5" stop-color="#303030"/><stop offset="1" stop-color="#181818"/></linearGradient><radialGradient id="red"><stop stop-color="#ef1b38"/><stop offset=".5" stop-color="#b80723"/><stop offset="1" stop-color="#640914"/></radialGradient><radialGradient id="gold"><stop stop-color="#ffe784"/><stop offset=".6" stop-color="#eabd27"/><stop offset="1" stop-color="#ac8008"/></radialGradient></defs><path d="M113 367 Q250 340 392 365 Q366 490 251 662 Q153 512 113 367" fill="url(#wrap)"/><path d="M245 646 Q230 673 238 690 M255 646 Q267 675 258 690" fill="none" stroke="#b6a06a" stroke-width="1.6"/><g id="flowers"></g></svg></button><p id="gift-title" tabindex="-1">꽃을 클릭하세요</p></section>
</main><canvas id="hearts" aria-hidden="true"></canvas>
<script src="app.js"></script>
</body></html>
